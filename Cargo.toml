[package]
name = "r-package-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Transactional installation of predownloaded R package artifacts"
license = "MIT"
repository = "https://github.com/rrepo-org/r-package-installer"
documentation = "https://docs.rs/r-package-installer"
readme = "README.md"
keywords = ["r", "packages", "installer", "cache", "transactional"]
categories = ["development-tools", "filesystem"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependencies]
command-group = "5"
flate2 = "1"
hex = "0.4"
object = { version = "0.37", default-features = false, features = ["read"] }
r-dcf-syntax = "0.2"
r-description-parser = "0.2"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
zip = { version = "5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
